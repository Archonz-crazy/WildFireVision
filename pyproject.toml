[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wildfirevision"
version = "0.1.0"
description = "Deep learning wildfire detection using VGG16 transfer learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mahikshit Kurapati" },
    { name = "Pooja Chandrashekara" },
    { name = "Mohammad Kanu" },
]
dependencies = [
    "tensorflow>=2.14,<2.16",
    "streamlit>=1.28",
    "mlflow>=2.8",
    "dvc>=3.30",
    "huggingface-hub>=0.19",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "altair>=5",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "black>=23", "pytest>=7", "pytest-cov>=4"]
training = ["kaggle>=1.5"]

[project.scripts]
wildfirevision-train = "wildfirevision.train:main"
wildfirevision-evaluate = "wildfirevision.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wildfirevision"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
src = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that require TensorFlow model weights (deselect with -m 'not slow')"]
